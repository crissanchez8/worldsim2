packages:
  - apps/*
  - packages/*
  - tools/*
  - spikes/*

# Versiones únicas para todo el monorepo (protocolo `catalog:`).
# TypeScript queda en 6.0: typescript-eslint 8.x todavía no soporta TS 7 (peer <6.1).
catalog:
  '@commitlint/cli': 21.2.3
  '@commitlint/config-conventional': 21.2.3
  '@playwright/test': 1.64.1
  '@eslint/js': 10.0.1
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # @types/three va un parche atrás de three: DefinitelyTyped publica por minor.
  '@types/three': 0.186.0
  '@vitejs/plugin-react': 6.1.2
  dependency-cruiser: 18.6.0
  eslint: 10.12.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  fast-check: 4.10.2
  fflate: 0.8.3
  globals: 17.13.0
  husky: 9.1.7
  i18next: 26.4.6
  lint-staged: 17.6.0
  prettier: 3.9.10
  react: 19.3.1
  react-dom: 19.3.1
  react-i18next: 17.0.18
  three: 0.186.1
  tsx: 4.23.15
  turbo: 2.11.8
  typescript: 6.0.3
  typescript-eslint: 8.71.2
  vite: 8.3.4
  vitest: 5.0.5
  # Contenido como datos (D54). 4.6.5 y no la última (4.6.7, de hace 4 días): preferimos
  # versiones con ≥ 2 semanas publicadas.
  zod: 4.6.5
  # UI de P1.6 (D54), con ≥ 2 semanas publicadas al 2026-10-17: router y listas virtualizadas de
  # TanStack, estado de UI con zustand y gráficos con uPlot.
  '@tanstack/react-router': 1.170.41
  '@tanstack/react-virtual': 3.14.13
  uplot: 1.6.32
  zustand: 5.0.15

# Todas las versiones exactas; el lockfile manda.
savePrefix: ''
engineStrict: true

# Dependencias autorizadas a correr scripts de instalación (pnpm 10 los bloquea por defecto).
onlyBuiltDependencies:
  - esbuild
