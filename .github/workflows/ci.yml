# CI/CD gratis (P0.16, D31): GitHub Actions (repo público, runners estándar) + Cloudflare Pages
# por direct upload. Se despliega exactamente el build que pasó los chequeos.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Determinismo completo (14.000 años en 3 motores) todas las noches y a pedido.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Suite de determinismo (tools/determinism): en los PR, los primeros 3.000 años (la corrida
  # completa con el motor real tarda ~2 min en Node y ~3 en cada navegador); en main y en el cron,
  # la completa (12.000 a.C. → 1900). Vacío = completa.
  DETERMINISM_YEARS: ${{ github.event_name == 'pull_request' && '3000' || '' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Caché de Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (estilo + determinismo + texto de UI + fronteras)
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Bench (regresión contra la línea base del runner)
        # Base propia del runner (x86, linux): comparar contra la del M1 Pro daba falsos positivos
        # en operaciones limitadas por memoria. Si GitHub cambia el hardware del runner, regenerar
        # docs/phases/P00/bench-baseline-ci.json desde el log de una corrida.
        # P1.9: incluye el escenario world-medium y sus presupuestos (escalados por la calibración
        # del runner). El JSON queda como artefacto para regenerar la base del runner al cerrar P1.
        run: |
          mkdir -p out
          pnpm ws bench --compare docs/phases/P00/bench-baseline-ci.json --tolerance 1.0 --out out/bench-ci.json

      - name: Bench del runner (JSON)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-ci
          path: out/bench-ci.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Build
        run: pnpm build

      - name: Armar el sitio (web + spikes)
        run: pnpm site

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
          retention-days: 7
          if-no-files-found: error

  determinism:
    name: determinism
    # Suite permanente (P1.0, tools/determinism): mismo hash por año en Chromium, Firefox y WebKit
    # que en Node, con el motor real; además contenido, mundo estático, core/math y RNG.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Horizonte: DETERMINISM_YEARS (arriba): 3.000 años en los PR, completa en main y en el cron
    # (BRIEF P1.0: el PR tiene que entrar en ~5 min).
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Caché de navegadores de Playwright
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Navegadores de Playwright
        working-directory: tools/determinism
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Referencia de Node + build (sin caché de Turbo)
        run: pnpm --filter @ws/determinism build

      - name: Comparar en los tres motores
        working-directory: tools/determinism
        run: pnpm exec playwright test

      # P1.5: la web en vivo (Worker de simulación, reproducción, guardar en IndexedDB y continuar
      # con el mismo hash) en Chromium y Firefox, con los navegadores ya instalados arriba.
      - name: E2E de la web (vivo, guardar y continuar)
        run: pnpm --filter @ws/web build && pnpm --filter @ws/web e2e

      - name: Resultados del E2E de la web (si falla)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-results
          path: apps/web/test-results
          retention-days: 7

  health:
    name: health
    # Salud histórica (P1.8): 10 seeds del mundo mediano contra el Apéndice A. Falla solo si una
    # seed rompe un invariante; las métricas son informativas en P1 y van al artefacto.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ws health (10 seeds)
        run: pnpm ws health --seeds 10 --compare docs/phases/P01/health-baseline.json --out out/health

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: health
          path: out/health/
          retention-days: 14
          if-no-files-found: warn

  deploy:
    name: deploy
    needs: check
    # Los PRs desde forks no tienen acceso a los secretos: no se despliegan.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: deploy-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: worldsim2
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: ¿Hay credenciales de Cloudflare?
        id: gate
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan los secretos CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID: no se despliega."
          fi

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: site
          path: site

      - name: Deploy a Cloudflare Pages
        id: pages
        if: steps.gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.0'
          packageManager: npm
          # Crea el proyecto la primera vez (direct upload, producción = main); si ya existe, sigue.
          preCommands: npx wrangler pages project create ${{ env.PAGES_PROJECT }} --production-branch=main || true
          command: pages deploy site --project-name=${{ env.PAGES_PROJECT }} --branch=${{ env.BRANCH }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }} --commit-dirty=true

      - name: Comentar el preview en el PR
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.pages.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.pages.outputs.pages-deployment-alias-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="**Preview** (Cloudflare Pages)

          - Rama: ${ALIAS_URL:-$DEPLOY_URL}
          - Este commit (\`${SHA:0:7}\`): ${DEPLOY_URL}
          - Spikes: \`/spikes/<nombre>/\`"
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --edit-last --create-if-none --body "$body"

      - name: Resumen
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_URL: ${{ steps.pages.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.pages.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "### Deploy"
            echo "- Deployment: $DEPLOY_URL"
            echo "- Alias: ${ALIAS_URL:-—}"
          } >> "$GITHUB_STEP_SUMMARY"
