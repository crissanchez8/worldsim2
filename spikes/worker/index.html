<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spike B · Worker + deltas + rebobinado</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      body {
        margin: 0;
        padding: 16px;
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(0, 760px) minmax(260px, 1fr);
      }
      canvas {
        width: 100%;
        aspect-ratio: 50 / 30;
        image-rendering: pixelated;
        border: 1px solid #8884;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      input[type='range'] {
        width: 100%;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
      }
      @media (max-width: 800px) {
        body {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="map" width="50" height="30"></canvas>
      <div class="controls">
        <button id="run">Correr</button>
        <button id="pause" disabled>Pausa</button>
        <label><input id="hash" type="checkbox" /> hash por año</label>
        <label
          >modo
          <select id="mode">
            <option value="owner">político</option>
            <option value="culture">cultura</option>
          </select></label
        >
        <button id="full" disabled>Estado completo al año del cursor</button>
      </div>
      <input id="timeline" type="range" min="0" max="0" value="0" disabled />
      <div id="cursor"></div>
    </main>
    <aside><pre id="hud">Cargando…</pre></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
