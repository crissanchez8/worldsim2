<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spike A · terreno</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #b9cbd9;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        max-width: min(760px, calc(100vw - 16px));
        padding: 8px 10px;
        background: rgb(10 14 20 / 0.78);
        color: #e8eef4;
        font:
          12px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        border-radius: 6px;
        pointer-events: auto;
      }
      #hud h1 {
        margin: 0 0 4px;
        font-size: 13px;
      }
      #hud pre {
        margin: 0 0 6px;
        white-space: pre-wrap;
        font: inherit;
      }
      #hud pre.result:empty {
        display: none;
      }
      #hud pre.result {
        color: #b6f3b0;
      }
      #hud .buttons {
        display: flex;
        gap: 6px;
        margin-bottom: 6px;
      }
      #hud button {
        font: inherit;
        padding: 3px 8px;
      }
      #hud .help {
        margin: 0;
        opacity: 0.7;
      }
      pre.fatal {
        position: fixed;
        inset: auto 8px 8px 8px;
        padding: 8px;
        background: #400;
        color: #fdd;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
